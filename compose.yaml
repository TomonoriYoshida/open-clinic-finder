services:
    app:
        image: node:22-alpine
        working_dir: /app
        # Run as the host user so node_modules/.next aren't created root-owned.
        user: '${UID:-1000}:${GID:-1000}'
        ports:
            - '${APP_PORT:-3002}:3000'
        environment:
            WATCHPACK_POLLING: 'true'
            npm_config_cache: /tmp/.npm
        volumes:
            - '.:/app'
        command: sh -c "npm install && npm run dev"
